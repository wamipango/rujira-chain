stages:
  - build
  - test
  - schema
  - optimize

build:
  stage: build
  needs: []
  image: docker.io/rust:1.75-slim-bullseye
  script:
    - apt update -y
    - apt install curl -y
    - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/cargo/bin
    - rustup component add clippy rustfmt
    - just cargo-compile
    - just cargo-clippy-check
    - just cargo-fmt-check
  cache:
    paths:
      - .cargo
      - target

test:
  stage: test
  needs: []
  image: docker.io/rust:1.75-slim-bullseye
  script:
    - apt update -y
    - apt install curl -y
    - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/cargo/bin
    - just cargo-test
  cache:
    paths:
      - .cargo
      - target
      
schema:
  stage: schema
  needs: []
  image: docker.io/rust:1.75-slim-bullseye
  script:
    - apt update -y
    - apt install curl git -y
    - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/cargo/bin
    - just generate-schema
    - git diff --exit-code || { echo "Schema generation resulted in a diff. Please run 'just generate-schema' locally and commit the changes."; exit 1; }
  cache:
    paths:
      - .cargo
      - target

optimize:
  stage: optimize
  image: docker:latest
  services:
    - docker:dind
  variables:
    U: "cosmwasm"
    V: "0.16.1"
    M: "x86_64"
    A: "linux/amd64"  # Mapping from x86_64 to amd64
  script:
    - export A="linux/${M/x86_64/amd64}"
    - export S=${M#x86_64}
    - export S=${S:+-$S}
    - docker run --platform $A --rm -v "$CI_PROJECT_DIR":/code \
        --mount type=volume,source="$(basename "$CI_PROJECT_DIR")_cache",target=/target \
        --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
        $U/optimizer$S:$V
