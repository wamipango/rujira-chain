[workspace]
members = ["packages/*", "contracts/*"]

# Resolver has to be set explicitely in workspaces, see https://github.com/rust-lang/cargo/issues/9956
resolver = "2"

[workspace.package]
version = "1.0.0"

[workspace.dependencies]
anybuf = "0.5"
cosmwasm-schema = "2.1.0"
cosmwasm-std = { version = "2.1.0", features = [
    "cosmwasm_1_4",
    # Enable this if you only deploy to chains that have CosmWasm 2.0 or higher
    "cosmwasm_2_1",
] }
cw-utils = "2.0.0"
cw-storage-plus = "2.0.0"
cw-multi-test = "2.0.0"
cw2 = "2.0.0"
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.58" }


[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
