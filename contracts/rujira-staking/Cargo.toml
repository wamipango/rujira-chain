[package]
authors = ["codehans <94654388+codehans@users.noreply.github.com>"]
edition = { workspace = true }
name    = "rujira-staking"
version = "1.2.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.thorchain]
# See more about format in https://doc.rust-lang.org/cargo/reference/manifest.html#the-metadata-table
auditors = ["Zellic", "Halborn"]
audits = [
  "https://github.com/Zellic/publications/blob/master/Rujira%20-%20Zellic%20Audit%20Report.pdf",
  "https://www.halborn.com/audits/thorchain/rujira-staking-319044",
]
commit = "80b48eddc0f16f735855442fdbc5423ac5398ff6"
deployers = ["thor1e0lmk5juawc46jwjwd0xfz587njej7ay5fh6cd"]
docs = "https://docs.rujira.network/understanding-ruji-token"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []
mock    = ["anyhow", "cw-multi-test", "rujira-rs-testing"]

[dependencies]
anyhow            = { workspace = true, optional = true }
cosmwasm-schema   = { workspace = true }
cosmwasm-std      = { workspace = true }
cw-multi-test     = { workspace = true, optional = true }
cw-storage-plus   = { workspace = true }
cw-utils          = { workspace = true }
cw2               = { workspace = true }
rujira-rs         = { workspace = true, features = ["interface-staking", "share-pool", "reply"], default-features = false }
rujira-rs-testing = { workspace = true, optional = true }
schemars          = { workspace = true }
serde             = { workspace = true }
thiserror         = { workspace = true }

[dev-dependencies]
cw-multi-test     = { workspace = true }
rujira-rs-testing = { workspace = true }
